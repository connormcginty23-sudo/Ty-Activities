<!DOCTYPE html>
<html lang="en" style="height: 100%; width: 100%; margin: 0; padding: 0;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TY Activities</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { 
            height: 100% !important; 
            width: 100% !important; 
            margin: 0 !important; 
            padding: 0 !important; 
            overflow: hidden !important; 
            font-family: 'Inter', sans-serif; 
            background-color: #0b2b1e; 
            color: #e2e8f0; 
        }
        #map { 
            background-color: #0b2b1e; 
            width: 100%; 
            height: 100%; 
            min-height: 400px;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b2b1e; }
        ::-webkit-scrollbar-thumb { background: #133824; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #1a4d33; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.8); }
        }
        .gold-pulse { animation: pulse-glow 2s infinite; }
        .custom-pin {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #133824;
            color: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 50%;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .custom-pin.active {
            background-color: #d4af37;
            color: #0b2b1e;
            border-color: #ffffff;
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
        }
    </style>
</head>
<body class="flex flex-col bg-[#0b2b1e]">

    <!-- Top Navigation Header -->
    <header class="bg-[#133824] border-b border-[#1a4d33]/60 px-6 py-3 flex items-center justify-between shrink-0 shadow-xl z-20 h-14">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-xl bg-[#1a4d33]/50 flex items-center justify-center text-[#d4af37] text-base shadow-inner border border-[#d4af37]/30">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div>
                <h1 class="text-sm font-bold tracking-tight text-white leading-none">TY Activities</h1>
                <p class="text-[11px] text-[#d4af37] font-medium mt-0.5" id="activity-counter">Location 0 of 0</p>
            </div>
        </div>

        <!-- Admin Passcode Controls -->
        <div class="flex items-center space-x-3">
            <button id="header-add-btn" onclick="openAddActivityModal()" class="hidden px-3 py-1 rounded-lg bg-[#d4af37] hover:bg-[#c39e2e] text-[#0b2b1e] text-xs font-semibold shadow-md transition flex items-center space-x-1.5">
                <i class="fa-solid fa-plus"></i>
                <span>Add Activity</span>
            </button>

            <div class="relative flex items-center">
                <i class="fa-solid fa-lock absolute left-3 text-xs text-emerald-400/60" id="lock-icon"></i>
                <input type="password" id="admin-passcode" placeholder="Passcode" 
                       oninput="checkPasscode()" 
                       class="pl-8 pr-3 py-1 text-xs bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-emerald-100 placeholder-emerald-600/50 focus:outline-none focus:border-[#d4af37] transition w-32">
            </div>

            <div id="admin-status" class="hidden text-xs px-2 py-0.5 rounded bg-emerald-950/80 text-emerald-400 border border-emerald-800/50 font-medium">
                <i class="fa-solid fa-user-shield mr-1"></i> Admin
            </div>
        </div>
    </header>

    <!-- Main Workspace: Sidebar + Satellite Map -->
    <div class="flex-1 flex overflow-hidden relative w-full h-[calc(100vh-56px)]">
        
        <!-- Left Sidebar -->
        <aside class="w-80 md:w-96 bg-[#0b2b1e]/95 backdrop-blur-md border-r border-[#1a4d33]/40 flex flex-col z-10 shadow-2xl shrink-0 h-full">
            <div class="p-3 border-b border-[#1a4d33]/40 flex items-center justify-between bg-[#0e3324]/40">
                <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-300/80">Destinations</h2>
                <div class="flex items-center space-x-2">
                    <button onclick="exportData()" title="Export JSON" class="text-emerald-400/70 hover:text-emerald-200 text-xs p-1">
                        <i class="fa-solid fa-download"></i>
                    </button>
                    <label title="Import JSON" class="text-emerald-400/70 hover:text-emerald-200 text-xs p-1 cursor-pointer">
                        <i class="fa-solid fa-upload"></i>
                        <input type="file" id="import-file" onchange="importData(event)" accept=".json" class="hidden">
                    </label>
                </div>
            </div>

            <!-- Scrollable Activity List -->
            <div id="activity-list" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Cards injected here -->
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="p-3 bg-[#0e3324] border-t border-[#1a4d33] flex items-center space-x-3 shrink-0">
                <button onclick="navigateActivity(-1)" class="px-4 py-2.5 rounded-xl bg-[#133824] hover:bg-[#1a4d33] text-emerald-200 border border-[#1a4d33] font-semibold text-xs flex items-center justify-center space-x-2 transition shrink-0 active:scale-95">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Prev</span>
                </button>
                <button onclick="navigateActivity(1)" class="flex-1 py-2.5 px-4 rounded-xl bg-gradient-to-r from-[#d4af37] to-[#f3e5ab] hover:from-[#c39e2e] hover:to-[#e2d49a] text-[#0b2b1e] font-bold text-xs flex items-center justify-center space-x-2 shadow-lg gold-pulse transition active:scale-95">
                    <span>NEXT LOCATION</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative bg-[#0b2b1e] h-full w-full">
            <div id="map"></div>
        </main>
    </div>

    <!-- Modal for Adding / Editing Activity -->
    <div id="activity-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[99999] flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-[#133824] border border-[#1a4d33] rounded-2xl w-full max-w-md p-6 shadow-2xl relative my-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 id="modal-title" class="text-lg font-bold text-white">Add New Activity</h3>
                <button onclick="closeActivityModal()" class="text-emerald-400 hover:text-white text-sm p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form id="activity-form" onsubmit="saveActivity(event)" class="space-y-4">
                <input type="hidden" id="edit-index" value="-1">

                <!-- Location Search Lookup in Modal -->
                <div class="bg-[#0b2b1e] p-3 rounded-xl border border-[#1a4d33]">
                    <label class="block text-xs font-semibold text-[#d4af37] mb-1"><i class="fa-solid fa-magnifying-glass mr-1"></i> Quick Location Search</label>
                    <div class="flex space-x-2">
                        <input type="text" id="modal-search-query" placeholder="e.g. Dublin Castle, Paris..." 
                               class="flex-1 px-3 py-1.5 text-xs bg-[#133824] border border-[#1a4d33] rounded-lg text-white placeholder-emerald-700 focus:outline-none focus:border-[#d4af37]">
                        <button type="button" onclick="searchLocationQuery()" class="px-3 py-1.5 bg-[#d4af37] hover:bg-[#c39e2e] text-[#0b2b1e] text-xs font-bold rounded-lg transition shrink-0">
                            Search
                        </button>
                    </div>
                    <p id="search-status" class="text-[11px] text-emerald-400 mt-1.5 hidden"></p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-emerald-200/80 mb-1">Title</label>
                    <input type="text" id="form-title" required placeholder="e.g. Dublin Castle Tour" 
                           class="w-full px-3 py-2 text-sm bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-white placeholder-emerald-700 focus:outline-none focus:border-[#d4af37]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-emerald-200/80 mb-1">Photo Image URL</label>
                    <input type="url" id="form-imageUrl" placeholder="https://images.unsplash.com/photo-..." 
                           class="w-full px-3 py-2 text-sm bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-white placeholder-emerald-700 focus:outline-none focus:border-[#d4af37]">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-emerald-200/80 mb-1">Location Name / Address</label>
                    <input type="text" id="form-location-name" required placeholder="e.g. Dame St, Dublin 2" 
                           class="w-full px-3 py-2 text-sm bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-white placeholder-emerald-700 focus:outline-none focus:border-[#d4af37]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-emerald-200/80 mb-1">Latitude</label>
                        <input type="number" step="any" id="form-lat" required placeholder="53.3429" 
                               class="w-full px-3 py-2 text-sm bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-white focus:outline-none focus:border-[#d4af37]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-emerald-200/80 mb-1">Longitude</label>
                        <input type="number" step="any" id="form-lng" required placeholder="-6.2674" 
                               class="w-full px-3 py-2 text-sm bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-white focus:outline-none focus:border-[#d4af37]">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-emerald-200/80 mb-1">Description</label>
                    <textarea id="form-desc" rows="3" placeholder="Details about this transition year activity..." 
                              class="w-full px-3 py-2 text-sm bg-[#0b2b1e] border border-[#1a4d33] rounded-lg text-white placeholder-emerald-700 focus:outline-none focus:border-[#d4af37]"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeActivityModal()" class="px-4 py-2 rounded-lg bg-[#0b2b1e] hover:bg-[#081e15] text-emerald-300 text-xs font-semibold">
                        Cancel
                    </button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-[#d4af37] hover:bg-[#c39e2e] text-[#0b2b1e] text-xs font-bold shadow-md">
                        Save Activity
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Engine -->
    <script>
        const STORAGE_KEY = "TY_ACTIVITIES_DATA_V1";
        const ADMIN_PASS = "ferret45";

        let isAdmin = false;
        let activeIndex = 0;
        let map = null;
        let markers = [];

        // Edit default locations here!
        const defaultActivities = [
            {
                title: "Trinity College & Book of Kells",
                locationName: "College Green, Dublin 2, Ireland",
                lat: 53.3438,
                lng: -6.2546,
                imageUrl: "https://images.unsplash.com/photo-1590089415225-401ed6f9db8e?auto=format&fit=crop&w=600&q=80",
                description: "Guided tour through Ireland's historic university library and exhibition."
            },
            {
                title: "Eiffel Tower Experience",
                locationName: "Champ de Mars, Paris, France",
                lat: 48.8584,
                lng: 2.2945,
                imageUrl: "https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?auto=format&fit=crop&w=600&q=80",
                description: "Cultural TY overseas trip to iconic landmarks across Paris."
            },
            {
                title: "Killarney National Park Adventure",
                locationName: "Killarney, Co. Kerry, Ireland",
                lat: 52.0167,
                lng: -9.5167,
                imageUrl: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80",
                description: "Outdoor leadership, kayaking, and hiking expedition in Kerry."
            },
            {
                title: "GAA Museum & Croke Park Skyline Walk",
                locationName: "Jones' Rd, Dublin 3, Ireland",
                lat: 53.3607,
                lng: -6.2512,
                imageUrl: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=600&q=80",
                description: "Interactive sports heritage tour and roof walk above Croke Park."
            }
        ];

        let activities = [];

        function loadActivities() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    activities = JSON.parse(stored);
                } catch (e) {
                    activities = [...defaultActivities];
                }
            } else {
                activities = [...defaultActivities];
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(activities));
        }

        window.onload = function() {
            loadActivities();

            // Initialize Map with Satellite Layer
            map = L.map('map', { zoomControl: false }).setView([activities[0].lat, activities[0].lng], 16);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 18
            }).addTo(map);

            L.control.zoom({ position: 'topright' }).addTo(map);

            setTimeout(() => { map.invalidateSize(); }, 300);

            renderList();
            renderPins();
            selectActivity(0);
        };

        function renderPins() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            activities.forEach((act, idx) => {
                const isSelected = idx === activeIndex;
                const customIcon = L.divIcon({
                    className: '',
                    html: `<div class="custom-pin ${isSelected ? 'active' : ''}" style="width:32px; height:32px;">${idx + 1}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([act.lat, act.lng], { icon: customIcon }).addTo(map);
                marker.on('click', () => selectActivity(idx));
                markers.push(marker);
            });
        }

        function renderList() {
            const listEl = document.getElementById("activity-list");
            listEl.innerHTML = "";

            activities.forEach((act, idx) => {
                const isSelected = idx === activeIndex;
                const card = document.createElement("div");
                card.className = `p-4 rounded-xl transition cursor-pointer border overflow-hidden ${
                    isSelected 
                        ? 'bg-[#133824] border-[#d4af37] shadow-lg scale-[1.01]' 
                        : 'bg-[#0e3324]/60 hover:bg-[#133824]/80 border-[#1a4d33]/50'
                }`;

                card.onclick = () => selectActivity(idx);

                const imgUrl = act.imageUrl || `https://placehold.co/600x400/133824/d4af37?text=${encodeURIComponent(act.title)}`;

                card.innerHTML = `
                    <div class="w-full h-28 -mx-4 -mt-4 mb-3 overflow-hidden relative border-b border-[#1a4d33]/50">
                        <img src="${imgUrl}" alt="${act.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/133824/d4af37?text=Location+Image'">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#0e3324] via-transparent to-transparent opacity-80"></div>
                    </div>
                    <div class="flex items-start justify-between space-x-3">
                        <div class="flex items-start space-x-3">
                            <div class="w-7 h-7 rounded-lg ${isSelected ? 'bg-[#d4af37] text-[#0b2b1e]' : 'bg-[#1a4d33] text-[#d4af37]'} flex items-center justify-center font-bold text-xs shrink-0 shadow">
                                ${idx + 1}
                            </div>
                            <div>
                                <h3 class="text-sm font-bold text-white leading-snug">${act.title}</h3>
                                <p class="text-xs text-emerald-300/80 mt-0.5"><i class="fa-solid fa-location-dot text-[#d4af37] mr-1"></i>${act.locationName}</p>
                            </div>
                        </div>
                        ${isAdmin ? `
                            <div class="flex items-center space-x-1 shrink-0" onclick="event.stopPropagation()">
                                <button onclick="openEditActivityModal(${idx})" class="p-1.5 text-emerald-400 hover:text-white rounded bg-[#1a4d33]/60 hover:bg-[#1a4d33] text-xs">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="deleteActivity(${idx})" class="p-1.5 text-rose-400 hover:text-rose-200 rounded bg-[#1a4d33]/60 hover:bg-rose-900/50 text-xs">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                    ${act.description ? `<p class="text-xs text-emerald-200/60 mt-2.5 pl-10 border-l border-[#1a4d33]/50">${act.description}</p>` : ''}
                `;

                listEl.appendChild(card);
            });

            document.getElementById("activity-counter").innerText = `Location ${activities.length > 0 ? activeIndex + 1 : 0} of ${activities.length}`;
        }

        function selectActivity(index) {
            if (index < 0 || index >= activities.length) return;
            activeIndex = index;
            renderList();
            renderPins();

            const act = activities[index];
            map.flyTo([act.lat, act.lng], 16, {
                duration: 3.5,
                easeLinearity: 0.25
            });
        }

        function navigateActivity(dir) {
            if (activities.length === 0) return;
            let nextIdx = activeIndex + dir;
            if (nextIdx >= activities.length) nextIdx = 0;
            if (nextIdx < 0) nextIdx = activities.length - 1;
            selectActivity(nextIdx);
        }

        function checkPasscode() {
            const val = document.getElementById("admin-passcode").value;
            if (val === ADMIN_PASS) {
                isAdmin = true;
                document.getElementById("header-add-btn").classList.remove("hidden");
                document.getElementById("admin-status").classList.remove("hidden");
                document.getElementById("lock-icon").className = "fa-solid fa-unlock absolute left-3 text-xs text-[#d4af37]";
            } else {
                isAdmin = false;
                document.getElementById("header-add-btn").classList.add("hidden");
                document.getElementById("admin-status").classList.add("hidden");
                document.getElementById("lock-icon").className = "fa-solid fa-lock absolute left-3 text-xs text-emerald-400/60";
            }
            renderList();
        }

        function openAddActivityModal() {
            document.getElementById("modal-title").innerText = "Add New Activity";
            document.getElementById("edit-index").value = "-1";
            document.getElementById("activity-form").reset();
            document.getElementById("search-status").classList.add("hidden");
            document.getElementById("activity-modal").classList.remove("hidden");
        }

        function openEditActivityModal(index) {
            const act = activities[index];
            if (!act) return;
            document.getElementById("modal-title").innerText = "Edit Activity";
            document.getElementById("edit-index").value = index;
            document.getElementById("form-title").value = act.title;
            document.getElementById("form-imageUrl").value = act.imageUrl || "";
            document.getElementById("form-location-name").value = act.locationName;
            document.getElementById("form-lat").value = act.lat;
            document.getElementById("form-lng").value = act.lng;
            document.getElementById("form-desc").value = act.description || "";
            document.getElementById("search-status").classList.add("hidden");
            document.getElementById("activity-modal").classList.remove("hidden");
        }

        function closeActivityModal() {
            document.getElementById("activity-modal").classList.add("hidden");
        }

        async function searchLocationQuery() {
            const query = document.getElementById("modal-search-query").value.trim();
            const statusEl = document.getElementById("search-status");
            if (!query) {
                statusEl.innerText = "Please type a location to search.";
                statusEl.className = "text-[11px] text-rose-400 mt-1.5";
                statusEl.classList.remove("hidden");
                return;
            }

            statusEl.innerText = "Searching location...";
            statusEl.className = "text-[11px] text-emerald-400 mt-1.5";
            statusEl.classList.remove("hidden");

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const place = data[0];
                    document.getElementById("form-lat").value = parseFloat(place.lat).toFixed(4);
                    document.getElementById("form-lng").value = parseFloat(place.lon).toFixed(4);
                    document.getElementById("form-location-name").value = place.display_name.split(',')[0] + ", " + (place.display_name.split(',')[1] || "");
                    if (!document.getElementById("form-title").value) {
                        document.getElementById("form-title").value = place.display_name.split(',')[0];
                    }
                    statusEl.innerText = "✓ Found location & filled coordinates!";
                    statusEl.className = "text-[11px] text-[#d4af37] mt-1.5 font-semibold";
                } else {
                    statusEl.innerText = "Location not found. Try another search term.";
                    statusEl.className = "text-[11px] text-rose-400 mt-1.5";
                }
            } catch (err) {
                statusEl.innerText = "Error searching location.";
                statusEl.className = "text-[11px] text-rose-400 mt-1.5";
            }
        }

        function saveActivity(e) {
            e.preventDefault();
            const editIdx = parseInt(document.getElementById("edit-index").value);
            
            const newAct = {
                title: document.getElementById("form-title").value,
                imageUrl: document.getElementById("form-imageUrl").value,
                locationName: document.getElementById("form-location-name").value,
                lat: parseFloat(document.getElementById("form-lat").value),
                lng: parseFloat(document.getElementById("form-lng").value),
                description: document.getElementById("form-desc").value
            };

            if (editIdx >= 0) {
                activities[editIdx] = newAct;
            } else {
                activities.push(newAct);
                activeIndex = activities.length - 1;
            }

            saveToLocalStorage();
            closeActivityModal();
            renderList();
            renderPins();
            selectActivity(editIdx >= 0 ? editIdx : activities.length - 1);
        }

        function deleteActivity(index) {
            activities.splice(index, 1);
            if (activeIndex >= activities.length) activeIndex = Math.max(0, activities.length - 1);
            saveToLocalStorage();
            renderList();
            renderPins();
            if (activities.length > 0) selectActivity(activeIndex);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activities, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", "ty_activities.json");
            dlAnchorElem.click();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        activities = imported;
                        saveToLocalStorage();
                        activeIndex = 0;
                        renderList();
                        renderPins();
                        if (activities.length > 0) selectActivity(0);
                    }
                } catch(err) {
                    alert("Invalid JSON format.");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
